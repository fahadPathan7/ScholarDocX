# Test-only Postgres + pgvector database for the backend pytest suite.
#
# SCHOLARDOCX-0209: the test suite previously pointed at the production
# Supabase DATABASE_URL (loaded from .env by tests/conftest.py). This compose
# file brings up an isolated, throwaway Postgres with the pgvector extension
# the schema requires (models.py declares Vector(1024)). The suite picks it up
# automatically once .env.test exists — see backend/tests/conftest.py.
#
# This is NOT a dev or prod database. Run it with `make test-db-start`.

services:
  test-db:
    image: pgvector/pgvector:pg16
    container_name: scholardocx-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scholardocx_test
    ports:
      - "5433:5432"
    # pytest-xdist (-n auto in pytest.ini) spawns one worker per CPU core,
    # each holding its own SQLAlchemy engine pool (pool_size=10 + overflow=10
    # = up to 20 conns per worker). The default max_connections=100 can be
    # exhausted under parallelism on multi-core machines, surfacing as a
    # flaky "too many connections". 300 leaves comfortable headroom.
    command: postgres -c max_connections=300
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholardocx_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  test-db-data:
