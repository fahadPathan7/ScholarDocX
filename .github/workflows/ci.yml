# ScholarDocX — Continuous Integration (regression gate)
#
# Runs the full test suite on every push and pull request so regressions are
# caught before they land. Privacy-first: this workflow runs only tests; tests
# use an isolated Postgres service container and never touch real user data.
# No secrets are required — AI provider and key-missing paths are covered by
# mocks, and the DATABASE_URL points at the ephemeral CI Postgres instance.
#
# The two jobs mirror `make check` locally:
#   - backend:  pytest (against a Postgres service container)
#   - frontend: npm ci, npm run build (tsc + vite), npm test (vitest)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue fast and free-tier friendly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    # SCHOLARDOCX-0139: provision an ephemeral Postgres for the test run. The
    # app is Postgres-only; tests create/drop users and rows, so this isolated
    # DB is wiped per run. No real user data is involved.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scholardocx
          POSTGRES_PASSWORD: scholardocx
          POSTGRES_DB: scholardocx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholardocx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SCHOLARDOCX_WORKSPACE: ${{ runner.temp }}/scholardocx-workspace
      # Tests run against the CI Postgres service container. localhost maps to
      # the container's published port (GitHub Actions maps service ports).
      DATABASE_URL: postgresql://scholardocx:scholardocx@localhost:5432/scholardocx_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Run vitest
        working-directory: frontend
        run: npm test
