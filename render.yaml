# Render deployment config for ScholarDocX (SCHOLARDOCX-0139).
# Deploy both backend + frontend on Render (single host, $0 free tier).
#
# Import this repo in the Render dashboard; Render auto-reads this file.
#
# Services:
#   1. Backend (FastAPI):  Web Service running uvicorn. Long-running process,
#      so Deep Hunt / Advisor Atlas async crawls are NOT killed by a function
#      timeout. Free Starter sleeps after 15 min idle.
#   2. Frontend (Vite/React): Static Site. Render builds it and serves dist/.
#      The build injects VITE_API_BASE_URL pointing at the backend.
#
# Required env vars (set in Render dashboard → Environment, NOT committed):
#   DATABASE_URL            - Supabase pooler URL (postgresql://...)
#   SUPABASE_URL            - https://<project>.supabase.co
#   SUPABASE_SECRET_KEY     - sb_secret_...
#   SUPABASE_BUCKET         - media
#   GLM_API_KEY, GEMINI_API_KEY, etc. - AI provider keys (optional)

services:
  # ── Backend: FastAPI + uvicorn ──────────────────────────────────────────
  - type: web
    name: scholardocx-backend
    runtime: python
    rootDir: backend
    pythonVersion: "3.13"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    autoDeploy: true
    envVars:
      - key: SCHOLARDOCX_WORKSPACE
        value: /tmp/scholardocx-workspace
      # Secrets — set these in the Render dashboard under Environment.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      # CORS: allow the frontend static site + localhost for dev.
      - key: CORS_ORIGINS
        sync: false
      - key: GLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_API_KEY_SCHOLARSHIP_HUNT
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false

  # ── Frontend: Vite static build ─────────────────────────────────────────
  # Render builds the React app and serves the dist/ folder on a CDN.
  # VITE_API_BASE_URL is injected at build time so the frontend knows where
  # the backend lives.
  - type: web
    name: scholardocx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    # Vite outputs to dist/ by default.
    staticPublishPath: dist
    autoDeploy: true
    # Pull-through: the frontend build needs the backend's public URL.
    # Set this in the dashboard to the backend's onrender.com URL + /api,
    # e.g. https://scholardocx-backend.onrender.com/api
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA fallback: serve index.html for client-side routes (React Router).
      - type: rewrite
        source: /*
        destination: /index.html
