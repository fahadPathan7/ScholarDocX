[pytest]
asyncio_default_fixture_loop_scope = function
# Collect only the real suite under tests/. The repo root holds legacy
# scratch files (e.g. test_api.py, test_saved_query.py) that pre-date the
# tests/ layout and break collection — one hits a live localhost server, one
# shadows tests/test_openrouter_cost.py. Limiting testpaths to tests/ keeps
# those scratch files around without letting them pollute the suite.
testpaths = tests
# SCHOLARDOCX-0178: this suite runs against a real shared Postgres database
# (tests/conftest.py loads the project's own DATABASE_URL — see
# AI-Context/CODE_RULES.md's "STRICT: never permanently mutate shared/global
# state for a test"), and several test files reuse a fixed test-user UUID
# across their own tests. `--dist loadscope` keeps all tests in one module
# on the same worker (so a file's fixed-UUID tests still run one at a time),
# while parallelizing freely *across* files/modules — full-throttle speed on
# a local multi-core machine without reintroducing the intra-file races this
# pattern is prone to. `-n auto` uses every available core.
addopts = --strict-markers -n auto --dist loadscope
markers =
    smoke: fast core-path tests safe to run on every change
    regression: guards against a known past regression
    slow: long-running or network-heavy tests

