# ScholarDocX — Continuous Integration (regression gate)
#
# Runs the full test suite on every push and pull request so regressions are
# caught before they land. Privacy-first: this workflow runs only tests; tests
# use tmp_path / isolated DBs and never touch real user data. No secrets are
# required — AI provider and key-missing paths are already covered by mocks.
#
# The two jobs mirror `make check` locally:
#   - backend:  pytest
#   - frontend: npm ci, npm run build (tsc + vite), npm test (vitest)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to keep the queue fast and free-tier friendly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    env:
      # Point the app at an ephemeral workspace so tests never read or write the
      # repo's checked-in `workspace/` dir. get_settings() reads this lazily, and
      # initialize_database() creates the db parent dir, so an empty tmp path is
      # sufficient. Honors the privacy-first / zero-infra-cost constraints: no
      # real user data is involved, only synthetic test fixtures.
      SCHOLARDOCX_WORKSPACE: ${{ runner.temp }}/scholardocx-workspace

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Run vitest
        working-directory: frontend
        run: npm test
